name: ci

# The gates run at release time too, but that is late: a broken commit would sit on
# main until someone tagged. This catches it at the commit.
#
# Smoke tests are deselected on purpose - they call live upstream sources, and an
# outage at a government portal is not a reason to redden our CI.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run gates
        run: python -m pytest tests/ -q -k "not smoke"
